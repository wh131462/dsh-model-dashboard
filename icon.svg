<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img">
  <title>Model panel</title>
  <!-- A 270-degree gauge glyph: the visible bounds are centred on (18, 18) and
       the bottom opening carries slightly less margin than the top, which keeps
       the mass optically centred instead of sitting low in the 36px box. -->
  <path d="M11.07 26.83A9.8 9.8 0 1 1 24.93 26.83" fill="none" stroke="#247bbf" stroke-width="3" stroke-linecap="round"/>
  <path d="M18 19.9 23.23 14.67" fill="none" stroke="#247bbf" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="18" cy="19.9" r="2.2" fill="#247bbf"/>
</svg>
